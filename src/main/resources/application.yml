spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: japanese-learning-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/japanese_learning?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC}
    username: ${DB_USERNAME:japanese_app}
    password: ${DB_PASSWORD:n3_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-message: never

app:
  jwt:
    # Override in production. At least 32 random bytes are required.
    secret: ${JWT_SECRET:n3-development-secret-change-before-production-2026}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
